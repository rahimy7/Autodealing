      responses:
        "200":
          description: Delivery attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendTestPushResult"

  # ── PEDIDOS ──────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders, most recent first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: search
          in: query
          required: false
          description: Matches the order code, or the customer's name or phone.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: "De dónde salió el pedido; `subscription` = los de suscripción de Shopify."
          schema:
            type: string
            enum: [chat, manual, shopify, replacement, subscription]
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order by hand (one not opened from a conversation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order (status, shipping data, notes…)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  # ── INVENTARIO ───────────────────────────────────────────────────────────────
  /warehouses:
    get:
      operationId: listWarehouses
      tags: [inventory]
      summary: Almacenes, el de por defecto primero
      responses:
        "200":
          description: Almacenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
    post:
      operationId: createWarehouse
      tags: [inventory]
      summary: Crear un almacén (el primero queda por defecto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseInput"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

  /warehouses/{id}:
    patch:
      operationId: updateWarehouse
      tags: [inventory]
      summary: Editar un almacén
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseUpdate"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

  /inventory/stock:
    get:
      operationId: listStock
      tags: [inventory]
      summary: Existencias por producto y almacén, con comprometido, disponible, lo que viene y el punto de reorden
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema:
            type: integer
        - name: productId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: "`low` = bajo el punto de reorden o vendido de más."
          schema:
            type: string
            enum: [low]
      responses:
        "200":
          description: Existencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockRow"

  /inventory/lots:
    get:
      operationId: listLots
      tags: [inventory]
      summary: Lotes (capas de costo PEPS) con su saldo por almacén
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: integer
        - name: warehouseId
          in: query
          required: false
          schema:
            type: integer
        - name: withStock
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lotes
          content:
            application/json:
              schema:
