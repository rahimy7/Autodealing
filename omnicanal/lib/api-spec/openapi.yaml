    # ── Settings / Meta integrations ──────────────────────────────────────────
    WhatsappNumber:
      type: object
      description: >-
        One of the WhatsApp numbers this instance answers on. The inbox stamps
        each conversation with the number it arrived on, and replies go back out
        through that same number.
      required:
        - id
        - phoneNumberId
        - isPrimary
        - isActive
        - accessTokenSet
      properties:
        id:
          type: integer
        phoneNumberId:
          type: string
        displayNumber:
          type: ["string", "null"]
        verifiedName:
          type: ["string", "null"]
        label:
          type: ["string", "null"]
        isPrimary:
          type: boolean
        isActive:
          type: boolean
        # Same masking convention as the shared secrets above: the token itself
        # never leaves the server.
        accessTokenSet:
          type: boolean
        accessTokenPreview:
          type: ["string", "null"]

    WhatsappNumbersInput:
      type: object
      additionalProperties: false
      required: [numbers]
      properties:
        numbers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [phoneNumberId]
            properties:
              phoneNumberId:
                type: string
              displayNumber:
                type: ["string", "null"]
              verifiedName:
                type: ["string", "null"]
              label:
                type: ["string", "null"]
              isPrimary:
                type: boolean
              isActive:
                type: boolean
              # Omit or send empty to keep the stored token (or to keep using the
              # shared one). Same rule as the other secrets in this API.
              accessToken:
                type: ["string", "null"]

    WhatsappNumberDiscovery:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: ["string", "null"]
        numbers:
          type: array
          items:
            type: object
            required: [phoneNumberId]
            properties:
              phoneNumberId:
                type: string
              displayNumber:
                type: ["string", "null"]
              verifiedName:
                type: ["string", "null"]
              qualityRating:
                type: ["string", "null"]
              # True when this number is already saved on the instance, so the UI
              # can show it ticked instead of offering it as new.
              alreadyAdded:
                type: boolean

    IntegrationSettings:
      type: object
      description: >-
        Meta integration settings. Secret values are never returned; instead a
        boolean "<field>Set" flag and a masked "<field>Preview" are provided.
      required:
        - metaAppSecretSet
        - whatsappEnabled
        - whatsappAccessTokenSet
        - facebookEnabled
        - facebookPageAccessTokenSet
        - instagramEnabled
        - instagramAccessTokenSet
        - instagramAppSecretSet
      properties:
        # Meta App (shared)
        metaAppId:
          type: ["string", "null"]
        metaAppSecretSet:
          type: boolean
        metaAppSecretPreview:
          type: ["string", "null"]
        webhookVerifyToken:
          type: ["string", "null"]
        # WhatsApp
        whatsappEnabled:
          type: boolean
        whatsappPhoneNumberId:
          type: ["string", "null"]
        whatsappBusinessAccountId:
          type: ["string", "null"]
        whatsappDisplayNumber:
          type: ["string", "null"]
        whatsappAccessTokenSet:
          type: boolean
        whatsappAccessTokenPreview:
          type: ["string", "null"]
        # Facebook
        facebookEnabled:
          type: boolean
        facebookPageId:
          type: ["string", "null"]
        facebookPageAccessTokenSet:
          type: boolean
        facebookPageAccessTokenPreview:
          type: ["string", "null"]
        # Instagram
        instagramEnabled:
          type: boolean
        instagramBusinessAccountId:
          type: ["string", "null"]
        instagramAccessTokenSet:
          type: boolean
        instagramAccessTokenPreview:
          type: ["string", "null"]
        instagramAppSecretSet:
          type: boolean
          description: Clave secreta de la app de Instagram, con la que Meta firma los webhooks de Instagram con inicio de sesión con Instagram.
        instagramAppSecretPreview:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
          format: date-time

    IntegrationSettingsInput:
      type: object
      description: >-
        All fields optional. For secret fields (metaAppSecret, *AccessToken),
        omit or send an empty string to keep the stored value unchanged.
      properties:
        metaAppId:
          type: ["string", "null"]
        metaAppSecret:
          type: ["string", "null"]
        webhookVerifyToken:
          type: ["string", "null"]
        whatsappEnabled:
          type: boolean
        whatsappPhoneNumberId:
          type: ["string", "null"]
        whatsappBusinessAccountId:
          type: ["string", "null"]
        whatsappDisplayNumber:
          type: ["string", "null"]
        whatsappAccessToken:
          type: ["string", "null"]
        facebookEnabled:
          type: boolean
        facebookPageId:
          type: ["string", "null"]
        facebookPageAccessToken:
          type: ["string", "null"]
        instagramEnabled:
          type: boolean
        instagramBusinessAccountId:
          type: ["string", "null"]
        instagramAccessToken:
          type: ["string", "null"]
        instagramAppSecret:
          type: ["string", "null"]

