  /campaigns/{id}/report:
    get:
      operationId: getCampaignReport
      tags: [campaigns]
      summary: Campaign delivery results per recipient
      description: |
        Authenticated marketing report scoped to the instance database.
        summary contains total, accepted, sent, delivered, read, failed, pending,
        untracked and replied counts. Sent, delivered and read are cumulative.
        recipients contain state, event timestamps and delivery errors.
        Old sends have no provider id and are untracked. Replies count only explicit
        replies to tracked WhatsApp campaign messages, not unrelated inbox chats.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign, cumulative summary, recipients and updatedAt
          content:
            application/json:
              schema:
                type: object
                required: [campaign, summary, recipients, updatedAt]
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
                  summary:
                    type: object
                    additionalProperties:
                      type: integer
                  recipients:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  updatedAt:
                    type: string
                    format: date-time
        "404":
          description: Campaign not found
  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
