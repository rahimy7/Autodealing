      description: >-
        `pending` is where an order starts (the customer says they paid, nobody
        has verified the transfer yet); `cancelled` and `delivered` are the two
        ways an order ends.

    Order:
      type: object
      required: [id, code, contactId, status, quantity, source, priceCurrency, subtotalCents, discountCents, shippingChargeCents, totalCents, shippingCostCents, isSubscription, hasUnlinkedItems, stockOut, creditAppliedCents, items, createdAt, updatedAt]
      properties:
        id:
          type: integer
        code:
          type: string
          description: Display code derived from the id (e.g. "PED-000123"), not a stored value.
        contactId:
          type: integer
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        conversationId:
          type: ["integer", "null"]
          description: The conversation this order came from. Null for one entered by hand.
        status:
          $ref: "#/components/schemas/OrderStatus"
        product:
          type: ["string", "null"]
        quantity:
          type: integer
        amount:
          type: ["integer", "null"]
          description: What the customer transferred, as confirmed against the real payment — not necessarily what a chat message said.
        currency:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
          description: Given for tracking on shipments to the US — the only case the agent asks for it.
        paymentProofUrl:
          type: ["string", "null"]
          description: The receipt image/document — either uploaded to the order directly, or the customer's message that carried it.
        shippingLabelUrl:
          type: ["string", "null"]
          description: The uploaded waybill/label (Vimenpaq, Domex, UPS…) to print and put on the package.
        notes:
          type: ["string", "null"]
        createdByAgentName:
          type: ["string", "null"]
          description: Who entered it by hand. Null for one opened by PEDIDO_CONFIRMADO.
        contactEmail:
          type: ["string", "null"]
        source:
          $ref: "#/components/schemas/OrderSource"
        warehouseId:
          type: ["integer", "null"]
        warehouseName:
          type: ["string", "null"]
        priceCurrency:
          type: string
          description: La moneda de las líneas y los totales (no la del monto transferido).
        rateToBase:
          type: ["number", "null"]
        subtotalCents:
          type: integer
        discountCents:
          type: integer
        discountReason:
          type: ["string", "null"]
        shippingChargeCents:
          type: integer
          description: Lo que el cliente paga de envío.
        totalCents:
          type: integer
        shippingCostCents:
          type: integer
          description: Lo que nos costó el envío (cargos del despacho repartidos), en la moneda base.
        externalName:
          type: ["string", "null"]
          description: El número del pedido en Shopify ("#1234").
        isSubscription:
          type: boolean
        externalFinancialStatus:
          type: ["string", "null"]
          description: El estado del pago en Shopify (PAID, PENDING, AUTHORIZED, PARTIALLY_PAID, PARTIALLY_REFUNDED, REFUNDED, VOIDED, EXPIRED).
        externalNote:
          type: ["string", "null"]
          description: El comentario del pedido en Shopify (la nota del cliente y los datos del carrito). Solo lectura.
        externalTracking:
          type: array
          description: Las guías que Shopify ya tiene de los envíos del pedido (la etiqueta se compró allá o desde aquí vía Shopify). Solo lectura.
          items:
            $ref: "#/components/schemas/ExternalTracking"
        replacesOrderId:
          type: ["integer", "null"]
        hasUnlinkedItems:
          type: boolean
        stockOut:
          type: boolean
          description: Ya salió algo del almacén (no se cancela ni vuelve atrás desde el estado).
        creditAppliedCents:
          type: integer
          description: Lo pagado con notas de crédito del cliente.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required: [contactId]
      properties:
        contactId:
          type: integer
        conversationId:
          type: ["integer", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        warehouseId:
          type: ["integer", "null"]
        priceCurrency:
          type: ["string", "null"]
        discountCents:
          type: integer
        discountReason:
          type: ["string", "null"]
        shippingChargeCents:
          type: integer
        product:
          type: ["string", "null"]
        quantity:
          type: integer
          default: 1
        amount:
          type: ["integer", "null"]
        currency:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    OrderUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        dispatch:
          $ref: "#/components/schemas/OrderDispatchInput"
        items:
          type: array
          description: Reemplaza las líneas (solo antes de despachar).
          items:
            $ref: "#/components/schemas/OrderItemInput"
        warehouseId:
          type: ["integer", "null"]
        discountCents:
          type: integer
        discountReason:
          type: ["string", "null"]
        shippingChargeCents:
          type: integer
        product:
          type: ["string", "null"]
        quantity:
          type: integer
        amount:
          type: ["integer", "null"]
        currency:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ActiveOrderSummary:
      type: object
      required: [id, code, status, quantity]
      description: The most recent order of this conversation that hasn't finished yet — shown as a badge in the chat.
      properties:
        id:
          type: integer
        code:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        product:
          type: ["string", "null"]
        quantity:
          type: integer

    # ── Casos ────────────────────────────────────────────────────────────────────
    CaseType:
      type: string
      enum:
        [
          prayer_request,
          visitation,
          bible_study,
          worship,
          volume_discount,
          partnership,
          subscription,
          order_status,
          order_error,
          theft_report,
          payment_issue,
          refund,
          cancellation,
          address_change,
          product_quality,
          product_question,
          other,
        ]
      description: What the customer is asking for. Decides who takes it and how it tends to be resolved.

    AgentLessonStatus:
      type: string
      enum: [suggested, active, dismissed]
      description: >-
        `suggested` was seen once and waits for the team, `active` is read by every
        virtual agent (automatic once it repeats in another conversation), `dismissed`
        was discarded by the team and never reactivates on its own.

    AgentLessonEvidence:
      type: object
      required: [id, signal, severity, conversationId, aiReply, reaction, createdAt]
      description: One real exchange behind a lesson — what the agent said next to how it landed.
      properties:
        id:
          type: integer
        signal:
          type: string
          enum: [frustration, human_correction]
        severity:
          type: string
        conversationId:
          type: integer
        contactName:
          type: ["string", "null"]
        aiReply:
          type: string
        reaction:
          type: string
          description: The customer's reaction, or what the team member wrote instead.
        diagnosis:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AgentLesson:
      type: object
      required: [id, lesson, status, occurrences, lastSeenAt, createdAt, evidence]
      properties:
        id:
          type: integer
        lesson:
          type: string
          description: The rule as the agent reads it in its prompt.
        diagnosis:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AgentLessonStatus"
        occurrences:
          type: integer
          description: How many distinct conversations it was seen in.
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentLessonEvidence"

    AgentLessonUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentLessonStatus"
        lesson:
          type: string
          minLength: 1
          maxLength: 400

    AnswerReviewStatus:
      type: string
      enum: [pending, review, approved, dismissed]
      description: >-
        `pending` has no answer yet, `review` has an answer waiting for the team,
        `approved` has an instruction the agents read, `dismissed` was set aside.

    AnswerReviewSource:
      type: string
      enum: [knowledge, chats, manual]

    AnswerPreview:
      type: object
      required: [text, images, photos, options, escalates]
      description: How the customer would see the answer — text without markers, the images and photos that go with it, the buttons.
      properties:
        text:
          type: string
        images:
          type: array
          items:
            type: object
            required: [key, url, caption]
            properties:
              key:
                type: string
              url:
                type: string
              caption:
                type: ["string", "null"]
        photos:
          type: array
          items:
            type: object
            required: [slug, name, imageUrl]
            properties:
              slug:
                type: string
              name:
                type: string
              imageUrl:
                type: ["string", "null"]
        options:
          type: array
          items:
            type: string
        escalates:
          type: boolean
          description: The agent hands the chat to a person (ESCALAR_A_HUMANO).

    AnswerReview:
      type: object
      required:
        [id, question, category, source, frequency, agentId, answer, preview, answeredAt, generating, generationError, indications, status, instruction, active, approvedAt, approvedByName, createdAt, updatedAt]
      properties:
        id:
          type: integer
        question:
          type: string
        category:
          type: ["string", "null"]
        source:
          $ref: "#/components/schemas/AnswerReviewSource"
        frequency:
          type: ["integer", "null"]
          description: How many recent chat messages ask this (only for questions detected in chats).
        agentId:
          type: ["integer", "null"]
          description: The agent the answer is tried with. The approved instruction is read by every agent.
        answer:
          type: ["string", "null"]
          description: The agent's last answer exactly as it wrote it, markers included.
        preview:
          oneOf:
            - $ref: "#/components/schemas/AnswerPreview"
            - type: "null"
        answeredAt:
          type: ["string", "null"]
          format: date-time
        generating:
          type: boolean
        generationError:
          type: ["string", "null"]
        indications:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AnswerReviewStatus"
        instruction:
          type: ["string", "null"]
          description: What the agents read in their prompt while `active` is true.
        active:
          type: boolean
        approvedAt:
          type: ["string", "null"]
          format: date-time
        approvedByName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AnswerTrainingAgent:
      type: object
      required: [id, name, profileType]
      properties:
        id:
          type: integer
        name:
          type: string
        profileType:
          type: ["string", "null"]

    AnswerTrainingList:
      type: object
      required: [items, agents, aiAvailable]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnswerReview"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AnswerTrainingAgent"
        aiAvailable:
          type: boolean

    AnswerReviewCreate:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
        category:
          type: ["string", "null"]
          maxLength: 80

    AnswerReviewUpdate:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
        category:
          type: ["string", "null"]
          maxLength: 80
        agentId:
          type: ["integer", "null"]
        indications:
          type: ["string", "null"]
          maxLength: 2000
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
        active:
          type: boolean
        status:
          type: string
          enum: [pending, dismissed]
          description: "`dismissed` sets the question aside (and turns its instruction off); `pending` brings it back."

    AnswerReviewProcess:
      type: object
      properties:
        indications:
          type: ["string", "null"]
          maxLength: 2000

    AnswerTrainingImport:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [knowledge, chats]
        days:
          type: integer
          minimum: 1
          maximum: 180
          description: For `chats`, how far back to read (default 30).

    AnswerTrainingImportResult:
      type: object
      required: [added, found]
      properties:
        added:
          type: integer
        found:
          type: integer
        scanned:
          type: integer
          description: For `chats`, how many distinct customer messages were read.

    AnswerTrainingGenerateResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer

    CaseStatus:
      type: string
      enum: [open, in_progress, waiting_customer, resolved, cancelled]
      description: >-
        `open` is untouched, `in_progress` someone is on it, `waiting_customer`
        is waiting on something from them (so the delay is not ours).

    CasePriority:
      type: string
      enum: [low, normal, high, urgent]

    CaseResolutionKind:
      type: string
      enum: [answered, actioned, rejected]
      description: >-
        The two ways a request ends — answering the question, or doing something
        about it — plus the honest third one for what was looked at and does not apply.

    Case:
      type: object
      required: [id, code, contactId, type, status, priority, channel, subject, openedByAi, createdAt, updatedAt]
      properties:
        id:
          type: integer
        code:
          type: string
          description: Display code derived from the id (e.g. "CASO-000123"), not a stored value.
        contactId:
          type: integer
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        type:
          $ref: "#/components/schemas/CaseType"
        status:
          $ref: "#/components/schemas/CaseStatus"
        priority:
          $ref: "#/components/schemas/CasePriority"
        channel:
          type: string
          description: Where the request came in — email, whatsapp, instagram, facebook or manual.
        emailThreadId:
          type: ["integer", "null"]
        conversationId:
          type: ["integer", "null"]
        orderId:
          type: ["integer", "null"]
        subject:
          type: string
        description:
          type: ["string", "null"]
        requestedAction:
          type: ["string", "null"]
          description: What the customer wants done, kept apart so it can be compared with what was actually done.
        resolutionKind:
          oneOf:
            - $ref: "#/components/schemas/CaseResolutionKind"
            - type: "null"
        resolution:
          type: ["string", "null"]
        assignedAgentId:
          type: ["integer", "null"]
        assignedAgentName:
          type: ["string", "null"]
        createdByAgentName:
          type: ["string", "null"]
        openedByAi:
          type: boolean
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CaseSummary:
      type: object
      required: [id, code, status, priority, subject, type]
      description: A case reduced to what a pill needs to show and link.
      properties:
        id:
          type: integer
        code:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        priority:
          $ref: "#/components/schemas/CasePriority"
        type:
          $ref: "#/components/schemas/CaseType"
        subject:
          type: string

    CaseEvent:
      type: object
      required: [id, kind, body, createdAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [opened, status, note, reply, action, assigned, resolved]
        body:
          type: string
        agentName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CaseDetail:
      type: object
      required: [case, events]
      properties:
        case:
          $ref: "#/components/schemas/Case"
        events:
          type: array
          items:
            $ref: "#/components/schemas/CaseEvent"

    CaseInput:
      type: object
      required: [contactId, subject]
      properties:
        contactId:
          type: integer
        type:
          $ref: "#/components/schemas/CaseType"
        priority:
          $ref: "#/components/schemas/CasePriority"
        subject:
          type: string
        description:
          type: ["string", "null"]
        requestedAction:
          type: ["string", "null"]
        emailThreadId:
          type: ["integer", "null"]
        conversationId:
          type: ["integer", "null"]
        orderId:
          type: ["integer", "null"]

    CaseUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CaseStatus"
        type:
          $ref: "#/components/schemas/CaseType"
        priority:
          $ref: "#/components/schemas/CasePriority"
        subject:
          type: string
        description:
          type: ["string", "null"]
        requestedAction:
          type: ["string", "null"]
        assignedAgentId:
          type: ["integer", "null"]
        orderId:
          type: ["integer", "null"]

    CaseEventInput:
      type: object
      required: [kind, body]
      properties:
        kind:
          type: string
          enum: [note, action]
          description: A note is what was found out; an action is something that was done about the case.
        body:
          type: string

    CaseResolutionInput:
      type: object
      required: [kind, resolution]
      properties:
        kind:
          $ref: "#/components/schemas/CaseResolutionKind"
        resolution:
          type: string
          description: What was said to the customer, or what was done. Required — a case closed with no account of it is what this view exists to avoid.
        replyToCustomer:
          type: ["string", "null"]
          description: >-
            Text to send the customer through the channel the case came in
            (email thread or chat) as part of closing it. Omit to close without writing to them.

    CaseSuggestion:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/CaseResolutionKind"
        reply:
          type: ["string", "null"]
          description: Draft answer for the customer, when the case can be resolved by answering. Null when the AI has no grounded answer.
        action:
          type: ["string", "null"]
          description: What the team has to do, when answering is not enough.
        note:
          type: ["string", "null"]
          description: Why the AI could not suggest anything, when it could not.
    AppointmentStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed, no_show]
      description: >-
        `pending` is what the virtual agent agreed with the customer and nobody
        has reviewed yet; `confirmed` has been checked against the real agenda.

    AppointmentSource:
      type: string
      enum: [ai, agent, admin]
      description: Who booked it. `ai` is the virtual agent booking on its own.

    Appointment:
      type: object
      required:
        [id, contactId, service, startsAt, durationMinutes, status, source, createdAt]
      properties:
        id:
          type: integer
        contactId:
          type: integer
        contactName:
          type: ["string", "null"]
          description: Resolved from the contact, so the agenda reads without a second call.
        contactPhone:
          type: ["string", "null"]
        conversationId:
          type: ["integer", "null"]
        agentId:
          type: ["integer", "null"]
        agentName:
          type: ["string", "null"]
        service:
          type: string
        notes:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        source:
          $ref: "#/components/schemas/AppointmentSource"
        createdAt:
          type: string
          format: date-time

    AppointmentInput:
      type: object
      required: [contactId, service, startsAt]
      properties:
        contactId:
          type: integer
        conversationId:
          type: ["integer", "null"]
        agentId:
          type: ["integer", "null"]
        service:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 2000
        location:
          type: ["string", "null"]
          maxLength: 300
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 1440
          default: 60
        status:
          $ref: "#/components/schemas/AppointmentStatus"

    AppointmentUpdate:
      type: object
      properties:
        agentId:
          type: ["integer", "null"]
        service:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 2000
        location:
          type: ["string", "null"]
          maxLength: 300
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        status:
          $ref: "#/components/schemas/AppointmentStatus"

    AppointmentConflict:
      type: object
      required: [error, conflicts]
      properties:
        error:
          type: string
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"

    AppointmentAvailability:
      type: object
      required: [available, conflicts, sameDay]
      properties:
        available:
          type: boolean
        conflicts:
          type: array
          description: Appointments that overlap the requested slot.
          items:
            $ref: "#/components/schemas/Appointment"
        sameDay:
          type: array
          description: Everything already booked that day, to offer an alternative.
          items:
            $ref: "#/components/schemas/Appointment"

    # ── Inventario ───────────────────────────────────────────────────────────────
    Warehouse:
      type: object
      required: [id, code, name, isDefault, active, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
        isDefault:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WarehouseInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
        isDefault:
          type: boolean

    WarehouseUpdate:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
        isDefault:
          type: boolean
        active:
          type: boolean

    StockStatus:
      type: string
      enum: [ok, low, negative]
      description: "`negative` = vendido de más (disponible bajo cero); `low` = en o bajo el punto de reorden."

    StockRow:
      type: object
      required: [productId, productName, warehouseId, warehouseName, onHand, valueCents, committed, available, onOrder, requested, need, status]
      properties:
        productId:
          type: integer
        productName:
          type: string
        sku:
          type: ["string", "null"]
        warehouseId:
          type: integer
        warehouseName:
          type: string
        onHand:
          type: integer
          description: Unidades físicamente en el almacén.
        valueCents:
          type: integer
          description: Lo que valen, a costo PEPS, en la moneda base.
        committed:
          type: integer
          description: Vendido y todavía sin despachar.
        available:
          type: integer
          description: En mano − comprometido.
        onOrder:
          type: integer
          description: Lo que falta por llegar de órdenes de compra abiertas.
        requested:
          type: integer
          description: Lo ya pedido en pedidos de compra abiertos.
        reorderRuleId:
          type: ["integer", "null"]
        minQuantity:
          type: ["integer", "null"]
        targetQuantity:
          type: ["integer", "null"]
        preferredSupplierId:
          type: ["integer", "null"]
        need:
          type: integer
          description: Cuánto pedir según el punto de reorden (0 si no hace falta).
        status:
          $ref: "#/components/schemas/StockStatus"
        nextExpiry:
          type: ["string", "null"]
          description: El vencimiento más próximo con existencia (YYYY-MM-DD).

    StockLotBalance:
      type: object
      required: [warehouseId, warehouseName, quantity, valueCents]
      properties:
        warehouseId:
          type: integer
        warehouseName:
          type: string
        quantity:
          type: integer
        valueCents:
