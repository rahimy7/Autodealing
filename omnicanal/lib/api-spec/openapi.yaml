          description: Appointments in the range, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: The slot overlaps an appointment already booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflict"

  /appointments/availability:
    get:
      operationId: checkAppointmentAvailability
      tags: [appointments]
      summary: Whether a slot is free, and what else is booked that day
      parameters:
        - name: startsAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: durationMinutes
          in: query
          required: false
          schema:
            type: integer
        - name: agentId
          in: query
          required: false
          description: Check the agenda of one person only.
          schema:
            type: integer
      responses:
        "200":
          description: Availability of the requested slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentAvailability"

  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Reschedule an appointment or change its status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Appointment not found
        "409":
          description: The new slot overlaps an appointment already booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflict"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Appointment deleted
        "404":
          description: Appointment not found

components:
  schemas:
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [role, name, email, views]
      properties:
        role:
          type: string
          enum: [admin, agent]
        name:
          type: string
        email:
          type: string
        agentId:
          type: ["integer", "null"]
        views:
          type: array
          description: >
            Vistas del panel que el usuario puede abrir (tabla view_access), en el
            orden del menú. No dependen de su rol.
          items:
            type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8

    LoginResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"

    ViewAccessEntry:
      type: object
      required: [agentId, views]
      properties:
        agentId:
          type: integer
        views:
          type: array
          items:
            type: string

    ViewAccessList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ViewAccessEntry"

    ViewAccessInput:
      type: object
      required: [views]
      properties:
        views:
          type: array
          description: Las vistas que quedan; las demás se quitan. Al menos una.
          items:
            type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Push ──────────────────────────────────────────────────────────────────
    RegisterDeviceInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: >-
            Native device push token: the FCM registration token on Android, the
            hex APNs device token on iOS.
        platform:
          type: string
          enum: [ios, android, web]
        deviceName:
          type: ["string", "null"]

    UnregisterDeviceInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SendTestPushResult:
      type: object
      required: [ok, devices]
      properties:
        ok:
          type: boolean
        devices:
          type: integer
        detail:
          description: Why the delivery did not go through, when it did not.
          type: ["string", "null"]

    # ── Conversation ──────────────────────────────────────────────────────────
    Conversation:
      type: object
      required: [id, channel, status, contactId, createdAt, updatedAt, sessionStartedAt, unreadCount, lastMessage, messagingWindowOpen, activeOrder]
      properties:
        id:
          type: integer
        channel:
          type: string
          enum: [whatsapp, instagram, facebook]
        status:
          type: string
          enum: [open, resolved, bot, pending]
        contactId:
          type: integer
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        contactAvatar:
          type: ["string", "null"]
        agentId:
          type: ["integer", "null"]
        agentName:
          type: ["string", "null"]
        label:
          type: ["string", "null"]
          enum: [lead, vip, in_process, support, jovenes, junta, visitas, miembros, null]
          description: Legacy fixed-enum label. Prefer labelId/labelName/labelColor.
        labelId:
          type: ["integer", "null"]
          description: Dynamic intent label id (see /labels).
        labelName:
          type: ["string", "null"]
        labelColor:
          type: ["string", "null"]
        localityLabelId:
          type: ["integer", "null"]
          description: >-
            Locality label id (see /labels, kind "locality"): the branch this
            customer belongs to, resolved from the zone they gave. It is what
            decided which store's people received the handoff.
        localityName:
          type: ["string", "null"]
        localityColor:
          type: ["string", "null"]
        groupId:
          type: ["integer", "null"]
        groupName:
          type: ["string", "null"]
        activeOrder:
          description: The most recent order from this conversation that hasn't finished (delivered/cancelled) yet, or null if there isn't one.
          oneOf:
            - $ref: "#/components/schemas/ActiveOrderSummary"
            - type: "null"
        whatsappNumberId:
          type: ["integer", "null"]
          description: >-
            Which of the instance's WhatsApp numbers this conversation came in
            on. Replies go back out through it. Null on Instagram/Facebook and on
            conversations that predate multi-number support.
        whatsappNumberLabel:
          type: ["string", "null"]
          description: Internal name of that number ("Ventas"), for the inbox badge.
        whatsappNumberDisplay:
          type: ["string", "null"]
          description: That number as the customer sees it (+1 809 555 0100).
        contextSummary:
          type: ["string", "null"]
          description: Running AI summary of the CURRENT conversation session only.
        historySummary:
          type: ["string", "null"]
          description: Date-stamped trace of previous closed sessions, used as background reference only.
        sessionStartedAt:
          type: string
          format: date-time
          description: Start of the current session. Messages older than this belong to a closed conversation.
        closedAt:
          type: ["string", "null"]
          format: date-time
          description: When the current session was closed (inactivity or resolution). The next inbound message opens a new one.
        lastCustomerMessageAt:
          type: ["string", "null"]
          format: date-time
          description: When the customer last wrote. Null when the conversation has no inbound message yet (e.g. one started from the panel).
        messagingWindowOpen:
          type: boolean
          description: >-
            True while a free-form reply can still reach the customer (within
            24h of `lastCustomerMessageAt`). False — or when there is no
            `lastCustomerMessageAt` at all — means the channel will reject a
            normal message; on WhatsApp an approved template re-opens it.
        messagingWindowExpiresAt:
          type: ["string", "null"]
          format: date-time
          description: When the 24h window closes (or closed). Null when there is no `lastCustomerMessageAt`.
        saleClosedAt:
          type: ["string", "null"]
          format: date-time
          description: When this session was marked as a closed sale. Null when there was no sale (yet).
        saleProduct:
          type: ["string", "null"]
        saleSource:
          type: ["string", "null"]
          enum: [agent, ai, null]
          description: Who marked the sale — a person with "Venta cerrada", or the AI reading the closed chat.
        lastMessage:
          type: ["string", "null"]
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SaleMarkInput:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean
        product:
          type: ["string", "null"]
          description: What was sold, as the customer will read it in the post-sale templates.

    Followup:
      type: object
      required: [id, conversationId, kind, status, dueAt, attempts, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        agentId:
          type: ["integer", "null"]
        agentName:
          type: ["string", "null"]
        kind:
          type: string
          enum: [winback, delivery_check, satisfaction, repurchase, unanswered]
        status:
          type: string
          enum: [scheduled, sent, replied, skipped, cancelled, failed]
        dueAt:
          type: string
          format: date-time
        attempts:
          type: integer
        product:
          type: ["string", "null"]
        templateName:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
          format: date-time
        repliedAt:
          type: ["string", "null"]
          format: date-time
        detail:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ConversationInput:
      type: object
      required: [channel, contactId]
      properties:
        channel:
          type: string
          enum: [whatsapp, instagram, facebook]
        contactId:
          type: integer
        agentId:
          type: ["integer", "null"]

    ConversationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, resolved, bot, pending]
        agentId:
          type: ["integer", "null"]
        label:
          type: ["string", "null"]
        labelId:
          type: ["integer", "null"]
        groupId:
          type: ["integer", "null"]

    AssignInput:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: integer

    # ── Message ───────────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, conversationId, sender, content, type, isInternal, isEdited, isDeleted, onChannel, status, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        sender:
          type: string
          enum: [contact, agent, bot]
        content:
          type: string
        type:
          type: string
          enum: [text, image, document, audio, video, template]
        mediaUrl:
          type: ["string", "null"]
          description: API path of the stored media (e.g. /api/media/<file>) for audio, image, video and document messages.
        mediaName:
          type: ["string", "null"]
          description: Original file name of an attachment (e.g. "cotizacion.pdf"), for display and download.
        isAiSuggestion:
          type: boolean
        isInternal:
          type: boolean
          description: Panel-only audit note (routing, escalation, takeover, session closure). Not sent to the customer and not part of the AI's conversation history.
        isEdited:
          type: boolean
          description: True once this message has been edited from the panel. `content` already carries the current (edited) text — the original is kept in the database only, never returned here.
        isDeleted:
          type: boolean
          description: True once this message has been deleted from the panel. `content` becomes a placeholder — the original is kept in the database only. Deleting here never removes the message from the customer's WhatsApp/Messenger/Instagram, which Meta does not support.
        onChannel:
          type: boolean
          description: True when this message exists on the customer's channel and we hold its id (Meta accepted ours, or it arrived from the customer), so it can be quoted in a reply or corrected.
        status:
          type: string
          enum: [sent, failed]
          description: "\"failed\" when Meta rejected an outbound send (most commonly: the 24h customer-service window closed). Always \"sent\" for messages from the customer."
        failedReason:
          type: ["string", "null"]
          description: Why the channel rejected this message, when status is "failed".
        replyTo:
          description: The message this one replies to, as WhatsApp shows the quote above a reply. Null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/MessageQuote"
            - type: "null"
        createdAt:
          type: string
          format: date-time

    MessageQuote:
      type: object
      required: [id, sender, content, type]
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [contact, agent, bot]
        content:
          type: string
          description: The quoted message as the panel shows it (edited text, or the deleted placeholder).
        type:
          type: string
          enum: [text, image, document, audio, video, template]

    MessageEditInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        sendCorrection:
          type: boolean
          description: 'Also send the customer "✏️ Corrección: <content>" as a reply quoting the original. Only honored when the message has `onChannel`. Meta has no API to edit a sent message, so this is the only way the change reaches them.'

    MessageInput:
      type: object
      required: [content, type]
      properties:
        content:
          type: string
        type:
          type: string
          enum: [text, image, document, audio, video, template]
        sender:
          type: string
          enum: [contact, agent]
          description: Defaults to "agent". Use "contact" to simulate inbound messages (triggers virtual agent reply). Bot messages are produced server-side only.
        replyToMessageId:
          type: integer
          description: Reply quoting this message of the same conversation. It must be `onChannel` and not deleted; on WhatsApp the customer sees the quote.

    MessageTemplateInput:
      type: object
      required: [name, language]
      properties:
        name:
          type: string
          description: Approved WhatsApp template name, from GET /conversations/{conversationId}/templates.
        language:
          type: string
          description: Template language code (e.g. "es", "es_DO"), from the same catalog entry.
        variables:
          type: array
          items:
            type: string
          description: Values for the BODY template's {{1}}, {{2}}… placeholders, in order. Omit or leave empty for a template with no variables.

    # ── Contact ───────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        metaProfileName:
          type: ["string", "null"]
          readOnly: true
        instagramUsername:
          type: ["string", "null"]
          readOnly: true
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
        tag:
          type: ["string", "null"]
          enum: [lead, vip, in_process, support, null]
        channels:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        buyerStatus:
          type: ["string", "null"]
        interests:
          type: array
          items:
            type: string
        purchaseProfile:
          type: ["string", "null"]
        facts:
          type: array
          description: Profile facts; populated by GET /contacts/{id}.
          items:
            $ref: "#/components/schemas/ContactFact"
        totalConversations:
          type: integer
        createdAt:
          type: string
          format: date-time

    ContactInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
        tag:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ContactUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
        tag:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        buyerStatus:
          type: ["string", "null"]
        interests:
          type: array
          items:
            type: string
        purchaseProfile:
          type: ["string", "null"]

    ContactFact:
      type: object
      required: [id, contactId, label, value, source, createdAt]
      properties:
        id:
          type: integer
        contactId:
          type: integer
        label:
          type: string
        value:
          type: string
        source:
          type: string
          enum: [ai, manual]
        createdAt:
          type: string
          format: date-time

    ContactFactInput:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    # ── Agent ─────────────────────────────────────────────────────────────────
    Agent:
      type: object
      required: [id, name, status, activeChats, type, role, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatar:
          type: ["string", "null"]
        status:
          type: string
          enum: [online, busy, offline]
        activeChats:
          type: integer
        channels:
          type: array
          items:
            type: string
        type:
          type: string
          enum: [human, virtual]
        role:
          type: string
          enum: [admin, agent]
          description: Access role for human users. Virtual agents always report "agent".
        profileType:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        escalateToAgentId:
          type: ["integer", "null"]
        escalateToGroupId:
          type: ["integer", "null"]
          description: When set, the agent escalates to this human group instead of a single agent.
        isActive:
          type: boolean
        capabilities:
          type: array
          description: Populated by GET /agents/{id}; omitted from the list endpoint.
          items:
            $ref: "#/components/schemas/Capability"
        createdAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
          description: Login password for human agents. Write-only; never returned.
        channels:
          type: array
          items:
            type: string
        type:
          type: string
          enum: [human, virtual]
        role:
          type: string
          enum: [admin, agent]
          description: Access role for human users. Ignored for virtual agents.
        profileType:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        escalateToAgentId:
          type: ["integer", "null"]
        escalateToGroupId:
          type: ["integer", "null"]

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
          description: Sets or resets the agent's login password. Write-only.
        status:
          type: string
          enum: [online, busy, offline]
        channels:
          type: array
          items:
            type: string
        role:
          type: string
          enum: [admin, agent]
          description: Access role for human users. Ignored for virtual agents.
        profileType:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        escalateToAgentId:
          type: ["integer", "null"]
        escalateToGroupId:
          type: ["integer", "null"]
        isActive:
          type: boolean

    PresenceInput:
      type: object
      properties:
        status:
          type: string
          enum: [online, busy]
          description: >
            Availability chosen by the agent. Being offline is not a choice: it
            follows from ending the session, so only these two can be set. Omit
            to refresh the heartbeat and keep the current choice.

    AgentPromptAssistInput:
      type: object
      required: [profileType, brief]
      properties:
        profileType:
          type: string
          enum: [sales, support, reservations, qualifier, general, winback, postsale]
        brief:
          type: string
          description: Short natural-language description of what this agent should do.
        agentName:
          type: ["string", "null"]
        tone:
          type: ["string", "null"]
          enum: [cercano, profesional, formal, divertido, null]
        model:
          type: ["string", "null"]

    AgentPromptAssistResult:
      type: object
      required: [ok, systemPrompt]
      properties:
        ok:
          type: boolean
        systemPrompt:
          type: string
        message:
          type: ["string", "null"]

    # ── Capability ──────────────────────────────────────────────────────────────
    Capability:
      type: object
      required: [id, agentId, name, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        knowledgeBaseId:
          type: ["integer", "null"]
        knowledgeBaseName:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        examples:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CapabilityInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        knowledgeBaseId:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        examples:
          type: ["string", "null"]
        level:
          type: ["string", "null"]

    CapabilityUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        knowledgeBaseId:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        examples:
          type: ["string", "null"]
        level:
          type: ["string", "null"]

    CapabilityAssistInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        brief:
          type: ["string", "null"]
          description: Optional extra context about what the capability does.

    CapabilityAssistResult:
      type: object
      required: [ok, description]
      properties:
        ok:
          type: boolean
        description:
          type: string
        message:
          type: ["string", "null"]

    # ── Knowledge base ──────────────────────────────────────────────────────────
    KnowledgeQuestionAssistInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: The question as the admin typed it, possibly informal or unclear.
        answer:
          type: ["string", "null"]
          description: The answer already drafted for this question, used as context to word the question precisely.
        categories:
          type: array
          description: Categories already used in this knowledge base, so the AI reuses one instead of inventing a near-duplicate.
          items:
            type: string
          default: []

    KnowledgeQuestionAssistResult:
      type: object
      required: [ok, question, category]
      properties:
        ok:
          type: boolean
        question:
          type: string
          description: The question reworded to be clear and complete, or the original text unchanged when the AI is unavailable.
        category:
          type: string
          description: The suggested category — one of the given `categories` when it fits, otherwise a new short label.
        message:
          type: ["string", "null"]

    KnowledgeBase:
      type: object
      required: [id, name, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeBaseInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        content:
          type: ["string", "null"]

    KnowledgeBaseUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        content:
          type: ["string", "null"]

    # ── Product catalog ─────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, slug, name, url, categories, categoryPaths, specs, properties]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        # Bullet list of product properties, from the technical data sheet.
        properties:
          type: array
          items:
            type: string
        # Recommended uses / application scope.
        uses:
          type: ["string", "null"]
        url:
          type: string
          description: Public product page, shared with customers in chat
        imageUrl:
          type: ["string", "null"]
        categories:
          type: array
          items:
            type: string
        categoryPaths:
          type: array
          items:
            type: string
        # Label→value pairs as published on the source sheet; the label set
        # varies per product family, so this is a free-form map.
        specs:
          type: object
          additionalProperties:
            type: string
        technicalSheetUrl:
          type: ["string", "null"]
        safetySheetUrl:
          type: ["string", "null"]
        sourceUpdatedAt:
          type: ["string", "null"]
          format: date-time
        sku:
          type: ["string", "null"]
        priceCents:
          type: ["integer", "null"]
          description: Precio de venta para pedidos y márgenes (no es lo que cotiza el agente por chat).
        priceCurrency:
          type: ["string", "null"]
        trackInventory:
          type: boolean
        active:
          type: boolean
        source:
          type: string
          enum: [import, manual]
        components:
          type: array
          description: Si es un kit, sus componentes.
          items:
            $ref: "#/components/schemas/ProductComponent"

    ProductCategory:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer

    # ── Custom messages ─────────────────────────────────────────────────────────
    CustomMessageButton:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: Echoed back by Meta when the customer taps the button
        label:
          type: string
          description: Visible text; WhatsApp caps it at 20 characters

    CustomMessage:
      type: object
      required: [id, name, kind, body, buttons, channels, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
        body:
          type: string
        imagePath:
          type: ["string", "null"]
          description: Supabase storage path
        imageUrl:
          type: ["string", "null"]
          description: Time-limited signed URL for previewing the image in the panel
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/CustomMessageButton"
        channels:
          type: array
          description: Empty means every channel
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomMessageInput:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
        kind:
          type: string
        body:
          type: string
        imagePath:
          type: ["string", "null"]
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/CustomMessageButton"
        channels:
          type: array
          items:
            type: string

    CustomMessageUpdate:
      type: object
      properties:
        name:
          type: string
        body:
          type: string
        imagePath:
          type: ["string", "null"]
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/CustomMessageButton"
        channels:
          type: array
          items:
            type: string

    CustomMessageActivation:
      type: object
      properties:
        isActive:
          type: boolean
          description: false deactivates instead

    CustomMessageImage:
      type: object
      required: [path, url]
      properties:
        path:
          type: string
        url:
          type: string
          description: Authenticated URL to preview it in the panel
        size:
          type: ["integer", "null"]
        updatedAt:
          type: ["string", "null"]

    # ── Agent group ─────────────────────────────────────────────────────────────
    GroupMember:
      type: object
      required: [agentId, name, activeConversations]
      properties:
        agentId:
          type: integer
        name:
          type: string
        status:
          type: ["string", "null"]
          enum: [online, busy, offline, null]
        activeConversations:
          type: integer
        capabilities:
          type: array
          items:
            type: string

    AgentGroup:
      type: object
      required: [id, name, distributionRule, memberCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        distributionRule:
          type: string
          enum: [round_robin, least_busy, by_capability, manual]
        memberCount:
          type: integer
        queuedConversations:
          type: integer
          description: Conversations waiting in this group's manual queue.
        members:
          type: array
          description: Populated by GET /groups/{id}; omitted from the list endpoint.
          items:
            $ref: "#/components/schemas/GroupMember"
        createdAt:
          type: string
          format: date-time

    AgentGroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        distributionRule:
          type: string
          enum: [round_robin, least_busy, by_capability, manual]

    AgentGroupUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        distributionRule:
          type: string
          enum: [round_robin, least_busy, by_capability, manual]

    GroupMemberInput:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: integer

    # ── Campaign ──────────────────────────────────────────────────────────────
    CampaignPayload:
      type: object
      description: Composed message config. Header fields apply to WhatsApp template headers; media applies to IG/FB free-form attachments.
      properties:
        bodyText:
          type: ["string", "null"]
        variables:
          type: array
          items:
            type: string
        header:
          type: ["object", "null"]
          properties:
            type:
              type: string
              enum: [image, video, document, location]
            mediaId:
              type: ["string", "null"]
            url:
              type: ["string", "null"]
            filename:
              type: ["string", "null"]
            latitude:
              type: ["number", "null"]
            longitude:
              type: ["number", "null"]
            name:
              type: ["string", "null"]
            address:
              type: ["string", "null"]
        media:
          type: ["object", "null"]
          properties:
            type:
              type: string
              enum: [image, video]
            url:
              type: ["string", "null"]

    MarketingTemplate:
      type: object
      required: [name, language, status, category, components]
      properties:
        name:
          type: string
        language:
          type: string
        status:
          type: string
        category:
          type: string
        components:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type:
                type: string
              format:
                type: ["string", "null"]
              text:
                type: ["string", "null"]

    CampaignRecipient:
      type: object
      required: [id, campaignId, channel, status]
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        contactId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        channel:
          type: string
        recipientExternalId:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, sent, failed]
        error:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
          format: date-time

    Campaign:
      type: object
      required: [id, name, channel, status, type, mode, recipientCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        channel:
          type: string
          enum: [whatsapp, instagram, facebook]
        whatsappNumberId:
          type: ["integer", "null"]
          description: >-
            Which WhatsApp number the campaign goes out from. Null on
            Instagram/Facebook campaigns and on ones created before multi-number
            support, which fall back to the primary number.
        status:
          type: string
          enum: [draft, scheduled, sending, sent, failed]
        type:
          type: string
          enum: [marketing, utility, authentication]
        mode:
          type: string
          enum: [template, freeform]
        message:
          type: ["string", "null"]
        templateName:
          type: ["string", "null"]
        templateLanguage:
          type: ["string", "null"]
        payload:
          oneOf:
            - $ref: "#/components/schemas/CampaignPayload"
            - type: "null"
        recipientCount:
          type: integer
        sentCount:
          type: integer
        failedCount:
          type: integer
        openedCount:
          type: integer
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        sentAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CampaignInput:
      type: object
      required: [name, channel, type]
      properties:
        name:
          type: string
        channel:
          type: string
          enum: [whatsapp, instagram, facebook]
        whatsappNumberId:
          type: ["integer", "null"]
          description: Which WhatsApp number to send from. Omit to use the primary one.
        type:
          type: string
          enum: [marketing, utility, authentication]
        mode:
          type: string
          enum: [template, freeform]
        message:
          type: ["string", "null"]
        templateName:
          type: ["string", "null"]
        templateLanguage:
          type: ["string", "null"]
        payload:
          $ref: "#/components/schemas/CampaignPayload"
        recipientContactIds:
          type: array
          items:
            type: integer
        scheduledAt:
          type: ["string", "null"]
          format: date-time

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [draft, scheduled]
        scheduledAt:
          type: ["string", "null"]
          format: date-time

    # ── Label (customer-intent) ─────────────────────────────────────────────────
    Label:
      type: object
      required: [id, name, slug, kind, color, isActive, isSafeForAutoReply, isSafeForEmailAutoReply, autoMigrateToDm, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        kind:
          $ref: "#/components/schemas/LabelKind"
        color:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        isSafeForAutoReply:
          type: boolean
          description: >-
            When true the virtual agent auto-publishes comment replies for
            conversations classified with this label (e.g. FAQ intents).
        isSafeForEmailAutoReply:
          type: boolean
          description: >-
            The same permission for email, kept separate on purpose: a public
            comment is read by everyone and an email by one person, so what can
            go out unreviewed is not the same in both places.
        autoMigrateToDm:
          type: boolean
          description: >-
            When true a comment classified with this label is automatically
            migrated to a DM Private Reply instead of answered publicly.
        createdAt:
          type: string
          format: date-time

    LabelKind:
      type: string
      enum: [intent, locality]
      description: >-
        What the label answers. "intent" is what the customer wants and is picked
        by the AI classifier; "locality" is where the customer is (a branch) and
        is set from the zone they gave, never classified. A locality label is what
        decides which store's people receive a handoff.

    LabelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LabelKind"
        color:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        isSafeForAutoReply:
          type: boolean
        isSafeForEmailAutoReply:
          type: boolean
        autoMigrateToDm:
          type: boolean

    LabelUpdate:
      type: object
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LabelKind"
        color:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        isSafeForAutoReply:
          type: boolean
        isSafeForEmailAutoReply:
          type: boolean
        autoMigrateToDm:
          type: boolean

    # ── Workflow (escalation flow) ──────────────────────────────────────────────
    WorkflowGraph:
      type: object
      description: >-
        Free-form reactflow graph { nodes, edges }. Stored and returned verbatim;
        node.data carries kind/labelId/agentId/groupId.
      additionalProperties: true
      properties:
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            additionalProperties: true

    Workflow:
      type: object
      required: [id, name, isActive, graph, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        channels:
          type: ["array", "null"]
          items:
            type: string
            enum: [whatsapp, instagram, facebook]
          description: >-
            Channels the flow applies to. Null or empty means general (applies to
            all channels). Listing a channel takes precedence over a general flow
            for that channel.
        isActive:
          type: boolean
        graph:
          $ref: "#/components/schemas/WorkflowGraph"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        channels:
          type: ["array", "null"]
          items:
            type: string
            enum: [whatsapp, instagram, facebook]
        isActive:
          type: boolean
        graph:
          $ref: "#/components/schemas/WorkflowGraph"

    WorkflowUpdate:
      type: object
      properties:
        name:
          type: string
        channels:
          type: ["array", "null"]
          items:
            type: string
            enum: [whatsapp, instagram, facebook]
        isActive:
          type: boolean
        graph:
          $ref: "#/components/schemas/WorkflowGraph"

    # ── Analytics ─────────────────────────────────────────────────────────────
    AnalyticsSummary:
      type: object
      description: >
        El día de hoy del negocio, tal como va. Todo lo que dice "hoy" se cuenta
        desde la medianoche de APP_TIMEZONE y no la de UTC, que en Santo Domingo
        empieza a las 8 de la noche del día anterior. Lo único que no es del día
        es lo que se llama "ahora" (lo que está abierto en este momento) y el
        total de contactos.
      required:
        - day
        - timeZone
        - salesClosedToday
        - conversationsToday
        - newConversationsToday
        - openConversations
        - botHandledToday
        - avgResponseMinutes
        - respondedToday
        - messagesSentToday
        - messagesReceivedToday
        - newContactsToday
        - totalContacts
        - campaignsSentToday
      properties:
        day:
          type: string
          description: >
            El día del negocio que se está contando, tal cual ("2026-09-20"). Se
            manda como texto a propósito: como fecha completa viajaría convertido
            a medianoche UTC, que en el Caribe es todavía el día anterior.
        timeZone:
          type: string
          description: Zona horaria con la que se decidió ese día.
        salesClosedToday:
          type: integer
          description: Ventas cerradas hoy, una por conversación como mucho.
        conversationsToday:
          type: integer
          description: Conversaciones en las que se cruzó algún mensaje hoy.
        newConversationsToday:
          type: integer
          description: De esas, las que empezaron hoy (sesión abierta hoy).
        openConversations:
          type: integer
          description: Abiertas o en cola ahora mismo, sean de hoy o de antes.
        botHandledToday:
          type: integer
          description: Conversaciones donde hoy contestó un agente virtual.
        avgResponseMinutes:
          type: number
          description: Minutos medios que esperó el cliente hoy por una respuesta.
        respondedToday:
          type: integer
          description: Cuántas esperas entraron en esa media (0 = no hay media).
        messagesSentToday:
          type: integer
          description: Mensajes que salieron hoy y no los rechazó el canal.
        messagesReceivedToday:
          type: integer
          description: Mensajes que escribieron los clientes hoy.
        newContactsToday:
          type: integer
        totalContacts:
          type: integer
        campaignsSentToday:
          type: integer

    ChannelStat:
      type: object
      description: El día de hoy por canal, con el mismo criterio que AnalyticsSummary.
      required: [channel, conversations, messages, sales]
      properties:
        channel:
          type: string
        conversations:
          type: integer
        messages:
          type: integer
        sales:
          type: integer
          description: Ventas cerradas hoy en ese canal.

    AgentPerformance:
      type: object
      description: >
        Lo que hizo hoy cada quien — solo los que tuvieron actividad. El tiempo de
        respuesta sale de los mensajes reales de sus conversaciones.
      required: [agentId, agentName, agentType, conversations, salesClosed, avgResponseMinutes, respondedCount]
      properties:
        agentId:
          type: integer
        agentName:
          type: string
        agentType:
          type: string
          description: "`human` o `virtual`."
        conversations:
          type: integer
        salesClosed:
          type: integer
        avgResponseMinutes:
          type: number
        respondedCount:
          type: integer
          description: Esperas medidas; 0 significa que no hay tiempo que mostrar.

    DailyVolume:
      type: object
      description: Un día del negocio (APP_TIMEZONE), no un día de UTC.
      required: [date, conversations, messages, sales]
      properties:
        date:
          type: string
          description: El día, tal cual ("2026-09-20").
        conversations:
          type: integer
        messages:
          type: integer
        sales:
          type: integer

    # ── Reports (admin) ─────────────────────────────────────────────────────────
    ReportsOverview:
      type: object
      required: [periodDays, periodFrom, periodTo, summary, byAgent, byChannel, byLabel, byLocality, byCampaignChannel, backlog, heatmap, labelByChannel, daily]
      properties:
        periodDays:
          type: integer
        periodFrom:
          type: string
          format: date
          description: Inclusive start date of the reporting window (server-resolved).
        periodTo:
          type: string
          format: date
          description: Inclusive end date of the reporting window (server-resolved).
        summary:
          $ref: "#/components/schemas/ReportsSummary"
        byAgent:
          type: array
          items:
            $ref: "#/components/schemas/ReportAgentStat"
        byChannel:
          type: array
          items:
            $ref: "#/components/schemas/ReportChannelStat"
        byLabel:
          type: array
          items:
            $ref: "#/components/schemas/ReportLabelStat"
        byLocality:
          type: array
          items:
            $ref: "#/components/schemas/ReportLocalityStat"
        byCampaignChannel:
          type: array
          items:
            $ref: "#/components/schemas/ReportCampaignStat"
        backlog:
          $ref: "#/components/schemas/ReportBacklog"
        heatmap:
          type: array
          description: Sparse activity grid — one cell per (dayOfWeek, hour) with at least one message.
          items:
            $ref: "#/components/schemas/ReportHeatmapCell"
        labelByChannel:
          type: array
          description: Sparse cross-tab of intent labels × channel. Only cells with at least one conversation are emitted.
          items:
            $ref: "#/components/schemas/ReportLabelChannelCell"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/ReportDailyStat"

    ReportsSummary:
      type: object
      required:
        - conversations
        - resolved
        - resolutionRate
        - inboundMessages
        - outboundMessages
        - botMessages
        - avgFirstResponseMinutes
        - medianFirstResponseMinutes
        - p90FirstResponseMinutes
        - p95FirstResponseMinutes
        - avgResolutionMinutes
        - medianResolutionMinutes
        - p95ResolutionMinutes
        - avgHandlingMinutes
        - avgMessagesPerConversation
        - avgTurnsPerSession
        - newContacts
        - returningContacts
        - returningShare
        - botToHumanEscalations
        - escalationRate
        - takeovers
        - takeoverRate
        - reopenedConversations
        - reopenRate
        - activeAgents
        - contactsReached
      properties:
        conversations:
          type: integer
        resolved:
          type: integer
        resolutionRate:
          type: number
          description: Resolved conversations as a percentage of all conversations in the period (0-100).
        inboundMessages:
          type: integer
        outboundMessages:
          type: integer
          description: Messages sent by human agents.
        botMessages:
          type: integer
          description: Messages sent by virtual (AI) agents.
        avgFirstResponseMinutes:
          type: number
          description: Average minutes between a customer's first message and the first reply.
        medianFirstResponseMinutes:
          type: number
        p90FirstResponseMinutes:
          type: number
        p95FirstResponseMinutes:
          type: number
        avgResolutionMinutes:
          type: number
          description: Average minutes from first inbound message to resolution across resolved conversations.
        medianResolutionMinutes:
          type: number
        p95ResolutionMinutes:
          type: number
        avgHandlingMinutes:
          type: number
          description: Average Handling Time — total active minutes of agent/bot work per conversation, approximated from message activity windows.
        avgMessagesPerConversation:
          type: number
        avgTurnsPerSession:
          type: number
          description: Average number of alternating turns (customer ↔ team) per session.
        newContacts:
          type: integer
          description: Contacts whose first-ever conversation started in this period.
        returningContacts:
          type: integer
          description: Contacts with at least one prior conversation before this period who also appear in it.
        returningShare:
          type: number
          description: Share of returning contacts among reached contacts (0-100).
        botToHumanEscalations:
          type: integer
        escalationRate:
          type: number
          description: Escalations as a share of conversations that received bot handling (0-100).
        takeovers:
          type: integer
          description: Times a human agent claimed a conversation via /claim.
        takeoverRate:
          type: number
          description: Takeovers as a share of all conversations in the period (0-100).
        reopenedConversations:
          type: integer
          description: Conversations whose session was reopened after being closed at least once.
        reopenRate:
          type: number
          description: Reopened conversations as a share of all conversations in the period (0-100).
        activeAgents:
          type: integer
        contactsReached:
          type: integer

    ReportAgentStat:
      type: object
      required:
        - agentId
        - agentName
        - type
        - conversations
        - resolved
        - resolutionRate
        - messages
        - avgFirstResponseMinutes
        - avgResolutionMinutes
        - activeMinutes
        - avgConcurrentChats
        - utilizationPercent
        - takeovers
      properties:
        agentId:
          type: integer
        agentName:
          type: string
        type:
          type: string
          enum: [human, virtual]
        conversations:
          type: integer
        resolved:
          type: integer
        resolutionRate:
          type: number
        messages:
          type: integer
          description: Replies this agent sent within its conversations.
        avgFirstResponseMinutes:
          type: number
        avgResolutionMinutes:
          type: number
        activeMinutes:
          type: number
          description: Approximated minutes of active work in the period, derived from message activity windows (idle gap 15 min).
        avgConcurrentChats:
          type: number
          description: Average simultaneously-active chats while the agent was working (approx).
        utilizationPercent:
          type: number
          description: Active minutes as a share of the business day (8h reference). 0-100.
        takeovers:
          type: integer

    ReportChannelStat:
      type: object
      required:
        - channel
        - conversations
        - resolved
        - resolutionRate
        - inboundMessages
        - outboundMessages
        - avgFirstResponseMinutes
        - medianFirstResponseMinutes
        - p95FirstResponseMinutes
        - avgResolutionMinutes
        - avgMessagesPerConversation
        - newContacts
        - returningContacts
      properties:
        channel:
          type: string
          enum: [whatsapp, instagram, facebook, email]
        conversations:
          type: integer
        resolved:
          type: integer
        resolutionRate:
          type: number
        inboundMessages:
          type: integer
        outboundMessages:
          type: integer
        avgFirstResponseMinutes:
          type: number
        medianFirstResponseMinutes:
          type: number
        p95FirstResponseMinutes:
          type: number
        avgResolutionMinutes:
          type: number
        avgMessagesPerConversation:
          type: number
