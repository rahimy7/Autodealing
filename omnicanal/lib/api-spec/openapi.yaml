      responses:
        "200":
          description: Configured numbers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [numbers]
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhatsappNumber"
    put:
      operationId: saveWhatsappNumbers
      tags: [settings]
      summary: Replace the list of WhatsApp numbers (upsert by phoneNumberId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappNumbersInput"
      responses:
        "200":
          description: Saved numbers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [numbers]
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhatsappNumber"

  /settings/whatsapp/numbers/discover:
    post:
      operationId: discoverWhatsappNumbers
      tags: [settings]
      summary: Ask Meta which numbers the configured WABA has (read-only)
      responses:
        "200":
          description: Numbers Meta reports for the WABA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappNumberDiscovery"

  /settings/whatsapp/numbers/{id}:
    delete:
      operationId: deleteWhatsappNumber
      tags: [settings]
      summary: Remove a WhatsApp number from the instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── FEED (Facebook/Instagram post comments) ───────────────────────────────────
  /feed/threads:
    get:
      operationId: listFeedThreads
      tags: [feed]
      summary: List comment threads for the Feed inbox
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [facebook, instagram, all]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, migrated, all]
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                type: object
                required: [threads]
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedThread"

  /feed/threads/{id}:
    get:
      operationId: getFeedThread
      tags: [feed]
      summary: Thread detail with comment timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thread + comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedThreadDetail"
        "404":
          description: Not found

  /feed/threads/{id}/read:
    post:
      operationId: markFeedThreadRead
      tags: [feed]
      summary: Clear the unread badge on a thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /feed/threads/{id}/reply:
    post:
      operationId: replyFeedThread
      tags: [feed]
      summary: Publish a human-written reply on a thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedReplyInput"
      responses:
        "200":
          description: Reply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedReplyResult"
        "502":
          description: Meta rejected the request

  /feed/threads/{id}/migrate:
    post:
      operationId: migrateFeedThread
      tags: [feed]
      summary: Send a Private Reply and open a DM conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedMigrateInput"
      responses:
        "200":
          description: DM conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedMigrateResult"
        "502":
          description: Meta rejected the Private Reply

  /feed/threads/{id}/resolve:
    post:
      operationId: resolveFeedThread
      tags: [feed]
      summary: Mark a thread as resolved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: Not found

  /feed/threads/{id}/reopen:
    post:
      operationId: reopenFeedThread
      tags: [feed]
      summary: Reopen a resolved thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reopened thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: Not found

  /feed/comments/{commentId}/publish:
    post:
      operationId: publishFeedDraft
      tags: [feed]
      summary: Approve and publish an AI-generated draft comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedPublishDraftInput"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedReplyResult"
        "502":
          description: Meta rejected

  /feed/comments/{commentId}/regenerate:
    post:
      operationId: regenerateFeedDraft
      tags: [feed]
      summary: Ask the AI to regenerate the draft for a thread
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New draft
          content:
            application/json:
              schema:
                type: object
                required: [ok, comment]
                properties:
                  ok:
                    type: boolean
                  comment:
                    $ref: "#/components/schemas/FeedComment"

  /feed/comments/{commentId}:
    delete:
      operationId: deleteFeedDraft
      tags: [feed]
      summary: Discard an AI-generated draft
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "409":
          description: Cannot delete a published comment

  # ── GMAIL (ajustes) ───────────────────────────────────────────────────────────
  /settings/gmail:
    get:
      operationId: getGmailSettings
      tags: [settings]
      summary: Configuración de Gmail (el Client Secret sale enmascarado)
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSettings"
    put:
      operationId: updateGmailSettings
      tags: [settings]
      summary: Guarda la configuración de Gmail (un secreto vacío conserva el guardado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailSettingsInput"
      responses:
        "200":
          description: Configuración guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSettings"

  /settings/gmail/connect:
    post:
      operationId: connectGmail
      tags: [settings]
      summary: Devuelve la URL de Google para autorizar el acceso al buzón
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailConnectInput"
      responses:
        "200":
          description: URL de autorización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailConnectResult"
        "400":
          description: Faltan el Client ID o el Client Secret

  /settings/gmail/disconnect:
    post:
      operationId: disconnectGmail
      tags: [settings]
      summary: Revoca el acceso y olvida la cuenta conectada (los correos ya importados se quedan)
      responses:
        "200":
          description: Configuración tras desconectar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSettings"

  /settings/gmail/sync:
    post:
      operationId: syncGmailNow
      tags: [settings]
      summary: Lee ahora los correos nuevos sin esperar al ciclo automático
      responses:
        "200":
          description: Resultado de la sincronización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSyncResult"

  /settings/gmail/import-inbox:
    post:
      operationId: importGmailInbox
      tags: [settings]
      summary: Trae lo que ya está en la bandeja principal, no solo lo nuevo. Corre en segundo plano.
      responses:
        "200":
          description: La importación arrancó (o no pudo arrancar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailImportInboxResult"

  # ── EMAIL (hilos de Gmail) ────────────────────────────────────────────────────
  /email/threads:
    get:
      operationId: listEmailThreads
      tags: [email]
      summary: Hilos de correo para la bandeja de Correo
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, all]
        - name: search
          in: query
          description: Busca en asunto, dirección, nombre del contacto y último mensaje.
          schema:
            type: ["string", "null"]
        - name: contactId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Hilos
          content:
            application/json:
              schema:
                type: object
                required: [threads]
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailThread"

  /email/threads/{id}:
    get:
      operationId: getEmailThread
      tags: [email]
      summary: Detalle del hilo con sus correos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hilo y correos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailThreadDetail"
        "404":
          description: No encontrado

  /email/threads/{id}/read:
    post:
      operationId: markEmailThreadRead
      tags: [email]
      summary: Marca el hilo como leído (también en Gmail)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /email/threads/{id}/reply:
    post:
      operationId: replyEmailThread
      tags: [email]
      summary: Envía una respuesta escrita por una persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailReplyInput"
      responses:
        "200":
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSendResult"
        "502":
          description: Gmail rechazó el envío

  /email/threads/{id}/draft:
    post:
      operationId: generateEmailDraft
      tags: [email]
      summary: Pide a la IA un borrador nuevo (reemplaza al pendiente)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Borrador generado, o la nota de por qué no hay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDraftResult"

  /email/threads/{id}/resolve:
    post:
      operationId: resolveEmailThread
      tags: [email]
      summary: Marca el hilo como resuelto (se reabre si el cliente vuelve a escribir)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /email/threads/{id}/reopen:
    post:
      operationId: reopenEmailThread
      tags: [email]
      summary: Reabre un hilo resuelto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /email/contact-candidates:
    get:
      operationId: listEmailContactCandidates
      tags: [email]
      summary: Contactos con los que vincular un hilo — sugeridos, o los que coinciden con la búsqueda
      parameters:
        - name: threadId
          in: query
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Candidatos
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailContactCandidate"

  /email/threads/{id}/link-contact:
    post:
      operationId: linkEmailThreadContact
      tags: [email]
      summary: Vincula el hilo a un contacto existente, uniendo ambos contactos en uno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLinkContactInput"
      responses:
        "200":
          description: Vinculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLinkContactResult"
        "404":
          description: Hilo o contacto no encontrado

  /email/compose:
    post:
      operationId: composeEmail
      tags: [email]
      summary: Redacta y envía un correo nuevo, sin que el cliente haya escrito primero
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailComposeInput"
      responses:
        "200":
          description: Correo enviado; se abrió un hilo nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailComposeResult"
        "400":
          description: Datos inválidos
        "404":
          description: El contacto elegido no existe
        "409":
          description: Gmail no está conectado
        "502":
          description: Gmail rechazó el envío

  /email/messages/{messageId}/send:
    post:
      operationId: sendEmailDraft
      tags: [email]
      summary: Aprueba y envía un borrador (con el texto editado, si se manda)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSendDraftInput"
      responses:
        "200":
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSendResult"
        "502":
          description: Gmail rechazó el envío

  /email/messages/{messageId}:
    delete:
      operationId: deleteEmailDraft
      tags: [email]
      summary: Descarta un borrador sin enviarlo
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Descartado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "409":
          description: Solo se descartan borradores

  # ── PUSH ──────────────────────────────────────────────────────────────────────
  /push/devices:
    post:
      operationId: registerDevice
