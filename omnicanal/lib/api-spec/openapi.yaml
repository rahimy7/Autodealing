      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Daily volume data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyVolume"

  /analytics/reports:
    get:
      operationId: getReportsOverview
      tags: [analytics]
      summary: Admin reports — performance by agent, by channel, and platform usage by label
      description: >-
        Conversations (chats and email threads) count in the period when they had a message, or were resolved,
        inside it — not by the date the conversation row was created — and only the messages of those days are
        counted. Days follow the business timezone.
      parameters:
        - name: days
          in: query
          description: Rolling window in days, today included. Ignored when both `from` and `to` are provided.
          schema:
            type: integer
            default: 30
        - name: from
          in: query
          description: Inclusive start day (YYYY-MM-DD) in the business timezone. Takes precedence over `days` when combined with `to`; the same day in both asks for that single day.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive end day (YYYY-MM-DD) in the business timezone. Takes precedence over `days` when combined with `from`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Reports overview for the selected period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsOverview"

