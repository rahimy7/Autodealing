      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterDeviceInput"
      responses:
        "200":
          description: Device dropped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
