          description: El banco rechazó la consulta o no respondió
        "503":
          description: La instancia no tiene las credenciales de la API del banco

  /exchange-rates/history:
    get:
      operationId: listExchangeRateHistory
      tags: [exchange-rates]
      summary: Consultas guardadas, de la más reciente a la más antigua
      parameters:
        - name: limit
          in: query
          description: Cuántas filas devolver (60 por defecto, 500 como máximo). Cada consulta guarda una por moneda.
          schema:
            type: integer
      responses:
        "200":
          description: Historial de tasas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeRate"

  # ── SETTINGS ──────────────────────────────────────────────────────────────────
  /settings/integrations:
