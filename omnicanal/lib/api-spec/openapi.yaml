    get:
      operationId: getReportsOverviewCsv
      tags: [analytics]
      summary: Admin reports — same data as /analytics/reports as a multi-section CSV
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV export
          content:
