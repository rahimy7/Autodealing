      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationSettingsInput"
      responses:
        "200":
          description: Updated integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationSettings"

  /settings/integrations/test:
    post:
      operationId: testIntegration
      tags: [settings]
      summary: Test a real connection to Meta for the given channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationTestInput"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationTestResult"

  /settings/whatsapp/numbers:
    get:
      operationId: listWhatsappNumbers
