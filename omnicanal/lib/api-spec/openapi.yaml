openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Omnicanal AI Communication Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: access
    description: Qué vistas del panel puede abrir cada usuario, independiente de su rol
  - name: conversations
    description: Unified inbox conversations
  - name: messages
    description: Messages within conversations
  - name: contacts
    description: Customer contacts
  - name: agents
    description: Platform agents
  - name: campaigns
    description: Marketing campaigns
  - name: labels
    description: Customer-intent labels
  - name: workflows
    description: Escalation workflows (visual flows)
  - name: knowledge
    description: Knowledge bases linked to agent capabilities
  - name: groups
    description: Human-agent groups and distribution rules
  - name: analytics
    description: Reports and metrics
  - name: settings
    description: Platform and Meta integration settings
  - name: plan
    description: Active plan, usage and configurable limits
  - name: feed
    description: Facebook/Instagram public post comment threads
  - name: email
    description: Correo de Gmail — hilos con clientes, borradores de IA y respuestas
  - name: push
    description: Mobile push-notification device registry
  - name: logs
    description: Errores del servidor, para que el administrador los revise
  - name: exchange-rates
    description: Tasa de cambio del día frente al peso dominicano (Banco Popular)
  - name: orders
    description: Pedidos tomados por chat, desde que el cliente paga hasta que le llega
  - name: cases
    description: Casos — las peticiones de los clientes que hay que gestionar (descuentos por volumen, robos, errores) y cómo se resolvieron
  - name: agentLessons
    description: Aprendizajes — lo que los agentes virtuales aprendieron de chats reales donde una respuesta frustró al cliente o una persona la corrigió
  - name: answerTraining
    description: Entrenar respuestas — las preguntas comunes con la respuesta que da hoy el agente, las indicaciones del equipo y la instrucción aprobada que leen los agentes
  - name: inventory
    description: Inventario por almacén con lotes y costo PEPS — existencias, comprometido, kárdex, ajustes, transferencias, punto de reorden y valuación
  - name: shipments
    description: Despachos — pedidos agrupados en un viaje o con un courier; registrar la salida descuenta el inventario y sus cargos son el costo del envío
  - name: shopify
    description: Shopify — se traen todos los pedidos de la tienda (web y suscripción) para comprometer inventario
  - name: usps
    description: USPS — etiquetas y franqueo de los envíos a Estados Unidos (se compran desde la parada de un despacho con courier), validación de la dirección, anulación y rastreo
  - name: purchasing
    description: Compras — pedido de compra (necesidad interna, también por punto de reorden), orden de compra al proveedor y recepción con lote, vencimiento y costo
  - name: returns
    description: Devoluciones y notas de crédito — lo que vuelve en buen estado entra al mismo lote y costo; las notas de crédito son internas, con NCF opcional

paths:
  # ── AUTH ─────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate an admin or human agent and issue a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session token and the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the user tied to the current session token
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Missing or invalid token

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password of the authenticated human user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid payload, or the account is not password-managed
        "401":
          description: Missing/invalid token, or the current password is wrong

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session and mark the signed-in agent as disconnected
      responses:
        "200":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Missing or invalid token

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── CONVERSATIONS ─────────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [whatsapp, instagram, facebook, all]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, bot, pending, all]
        - name: agentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: contactId
          in: query
          schema:
            type: ["integer", "null"]
        - name: whatsappNumberId
          in: query
          description: Only conversations that came in on this WhatsApp number.
          schema:
            type: ["integer", "null"]
        - name: read
          in: query
          description: "unread: conversations with unread messages; read: conversations with none."
          schema:
            type: string
            enum: [read, unread, all]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Update conversation (assign agent, change status, add label)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/assign:
    post:
      operationId: assignConversation
      tags: [conversations]
      summary: Assign a conversation to an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
      responses:
        "200":
          description: Conversation assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/claim:
    post:
      operationId: claimConversation
      tags: [conversations]
      summary: Take over a conversation as the authenticated agent
      description: >
        Self-service handoff: assigns the conversation to the agent making the
        request (no body — the agent is read from the session). Used by the
        read-only general chat panel so an agent can pull a chat into their inbox.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "403":
          description: Caller is not an agent
        "404":
          description: Not found

  /conversations/{id}/escalate:
    post:
      operationId: escalateConversation
      tags: [conversations]
      summary: Escalate conversation to its assigned agent's escalation target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/resolve:
    post:
      operationId: resolveConversation
      tags: [conversations]
      summary: Mark conversation as resolved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/sale:
    post:
      operationId: markConversationSale
      tags: [conversations]
      summary: Mark (or unmark) the current conversation as a closed sale
      description: >
        The agent's mark overrides the AI's reading of the chat. Marking it
        cancels the pending sales follow-up and schedules the post-sale sequence
        when an active workflow has a "sale_closed" trigger; unmarking removes
        the post-sale follow-ups that have not been sent yet.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleMarkInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "403":
          description: The conversation belongs to another agent
        "404":
          description: Not found

  /conversations/{id}/followups:
    get:
      operationId: listConversationFollowups
      tags: [conversations]
      summary: Follow-ups (sales recovery, post-sale, pending reply) scheduled or sent for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow-ups, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Followup"

  /conversations/{id}/followups/{followupId}/cancel:
    post:
      operationId: cancelConversationFollowup
      tags: [conversations]
      summary: Cancel a follow-up that has not been sent yet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: followupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Followup"
        "404":
          description: Not found, or already sent

  /conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark a conversation as read (reset unread count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  # ── MESSAGES ─────────────────────────────────────────────────────────────────
  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: The 24h customer-service window is closed; send an approved template instead

  /conversations/{conversationId}/templates:
    get:
      operationId: listConversationTemplates
      tags: [messages]
      summary: List approved WhatsApp templates that can reopen this conversation once its 24h window is closed
      description: >
        Empty array on Instagram/Facebook conversations — Meta has no downloadable
        template catalog for those channels. Only APPROVED templates are returned.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingTemplate"
        "404":
          description: Not found

  /conversations/{conversationId}/messages/template:
    post:
      operationId: sendMessageTemplate
      tags: [messages]
      summary: Send an approved WhatsApp template to reopen a conversation whose 24h window is closed
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateInput"
      responses:
        "201":
          description: Template sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not found

  /conversations/{conversationId}/messages/{messageId}:
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message's text in the panel, optionally sending the customer a quoted correction (Meta has no API to edit a sent message)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageEditInput"
      responses:
        "200":
          description: Edited message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not found
        "409":
          description: Message can't be edited (deleted, not text, or from the contact)
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Soft-delete a message (panel-only — the original stays in the database; Meta gives no way to unsend a business message on WhatsApp/Messenger/Instagram)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not found
        "409":
          description: Message already deleted, an internal note, or sent by the contact

  # ── CONTACTS ─────────────────────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: tag
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Contacts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a new contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contacts/{id}/meta-profile:
    post:
      operationId: syncContactMetaProfile
      tags: [contacts]
      summary: Refresh an existing contact profile from Meta without changing its recipient ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated contact; manually curated names are preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "422":
          description: This contact must be refreshed from an incoming message
        "502":
          description: Meta did not return a usable profile; existing data is unchanged

  /contacts/{id}/facts:
    post:
      operationId: createContactFact
      tags: [contacts]
      summary: Add a profile fact to a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFactInput"
      responses:
        "201":
          description: Fact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFact"

  /contacts/{id}/merge:
    post:
      operationId: mergeContact
      tags: [contacts]
      summary: Une otro contacto dentro de este (conversaciones, correos, comentarios y datos)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMergeInput"
      responses:
        "200":
          description: El contacto resultante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Alguno de los dos contactos no existe

  /contact-facts/{id}:
    delete:
      operationId: deleteContactFact
      tags: [contacts]
      summary: Delete a profile fact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── AGENTS ───────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: Agents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent by ID (includes its capabilities)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agents/me/presence:
    post:
      operationId: updateMyPresence
      tags: [agents]
      summary: Heartbeat for the signed-in agent, optionally changing their availability
      description: >
        Clients call this on a timer while the panel is open. An agent that stops
        sending it is reported as offline, so a closed tab never leaves a stale
        "online" behind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceInput"
      responses:
        "200":
          description: The signed-in agent with its effective status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: The session is not backed by an agent row
        "401":
          description: Missing or invalid token

  /view-access:
    get:
      operationId: listViewAccess
      tags: [access]
      summary: Vistas del panel de cada usuario humano
      description: Requiere la vista Administración.
      responses:
        "200":
          description: Las vistas de cada usuario humano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewAccessList"
        "403":
          description: El usuario no tiene la vista Administración

  /view-access/{agentId}:
    put:
      operationId: updateViewAccess
      tags: [access]
      summary: Dejar a un usuario con exactamente estas vistas
      description: >
        Reemplaza las vistas del usuario por las enviadas, sin importar su rol.
        Requiere la vista Administración. Hace falta al menos una vista, y nadie
        puede quitarse a sí mismo Administración.
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewAccessInput"
      responses:
        "200":
          description: Las vistas que quedaron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewAccessEntry"
        "400":
          description: Vistas que no existen, ninguna vista, o intento de quitarse Administración
        "403":
          description: El usuario no tiene la vista Administración
        "404":
          description: El usuario no existe o no es humano

  /agents/assist-prompt:
    post:
      operationId: assistAgentPrompt
      tags: [agents]
      summary: Generate a virtual agent system prompt with AI from a short brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPromptAssistInput"
      responses:
        "200":
          description: Prompt suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPromptAssistResult"

  /agents/assist-capability:
    post:
      operationId: assistCapability
      tags: [agents]
      summary: Draft a capability description with AI from a short name/brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
